# Cloudflare Worker config for the wiki diff editor (Stage 3 §3.1).
#
# Deploy:   cd editor && npx wrangler deploy          (needs a SCOPED api token:
#           Workers Scripts:Edit on the progress.org account — not the Global Key)
# Secret:   npx wrangler secret put GITHUB_TOKEN      (fine-grained PAT: contents:write
#           + pull_requests:write on floydmari/georgism-wiki ONLY)
# Local:    npx wrangler dev --local  (+ GITHUB_TOKEN in .dev.vars, git-ignored)
#
# Production routing (deployed 2026-08-07, Floyd's go-ahead): the whole app lives on a
# dedicated subdomain — wiki-edit.progress.org — as a Workers custom domain. A path route
# on www.progress.org was rejected because the app's /api/* endpoints would either escape
# the route or claim URL space on the main site. The theme's "Suggest an edit" button
# links to https://wiki-edit.progress.org/wiki/<slug>/edit.

name = "wiki-edit"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = false

# The custom domain wiki-edit.progress.org is attached server-side (one-time API
# call to /accounts/{id}/workers/domains, 2026-08-07) and is deliberately NOT
# declared here: the token lacks zone-level Workers Routes read, so a routes
# entry makes wrangler fail AFTER upload and never activate the new version.

[vars]
OWNER = "floydmari"
REPO = "georgism-wiki"
BASE_BRANCH = "main"
# Turnstile: flip to "1" once TURNSTILE_SITEKEY below is real and the
# TURNSTILE_SECRET worker secret is set (wrangler secret put TURNSTILE_SECRET).
# Widget creation needs the Turnstile:Edit scope on the API token (or 30s in dash).
REQUIRE_TURNSTILE = "1"
TURNSTILE_SITEKEY = "0x4AAAAAAEJUnjIdNAl_3zV0"
# Where submission notifications and T1 verdict emails go.
FLOYD_EMAIL = "floydmarinescu@gmail.com"
# Additional secrets (wrangler secret put ...): GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET,
# GMAIL_REFRESH_TOKEN (send-as Floyd; gmail.modify covers send — verified live),
# APPROVAL_SECRET (HMAC key for one-click approve/reject links).

# Rate limiting, two layers with different jobs:
#  - LIMITER (native ratelimit binding): the burst gate — atomic, cross-isolate,
#    5 requests per 60s per IP. Preferred over a KV counter because KV reads are
#    eventually consistent (rapid same-IP bursts can race a read-modify-write
#    counter), and over the in-isolate bucket because isolates don't share state.
#  - RL (KV): the slow hourly ledger — eventual consistency is fine at hour scale.
# Testing caveat (2026-08-07): per-IP limits cannot be exercised from the agent
# sandbox — its egress proxy rotates IPs per request (verified via ipify), so every
# probe looks like a new client. /api/health confirms both bindings are attached;
# a real single-IP client tripping the 429s is the remaining manual check.
[[unsafe.bindings]]
type = "ratelimit"
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "RL"
id = "e74b9b56dbf2439885eb44eec3115dd6"
